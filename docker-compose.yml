version: '3.8'

services:
  whatsapp-bot:
    build: .
    container_name: gkb-whatsapp-bot
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Persistent storage so WhatsApp login session survives reboots
      - ./auth_data:/app/.wwebjs_auth
    env_file:
      - .env
    environment:
      - PORT=3000
